services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: campaign
      POSTGRES_DB: campaign
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - campaign-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U campaign -d campaign"]
      interval: 5s
      timeout: 3s
      retries: 15
  game:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://campaign:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/campaign
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      PUBLIC_URL: ${PUBLIC_URL:?Set HTTPS PUBLIC_URL}
    depends_on:
      db:
        condition: service_healthy
volumes:
  campaign-data:
